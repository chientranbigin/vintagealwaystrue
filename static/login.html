<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Vintage Always True</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl mx-auto mb-3 shadow-md">
                VAT
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Đăng Nhập Quản Trị</h1>
            <p class="text-sm text-slate-500 mt-1">Hệ thống quản lý bán hàng Vintage Always True</p>
        </div>

        <div id="error-alert" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm">
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email / Tài khoản</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                       placeholder="root@alwaystrue.com" value="root@alwaystrue.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mật khẩu</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                       placeholder="Nhập mật khẩu...">
            </div>

            <div class="flex items-center justify-between text-xs text-slate-500">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="remember" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" checked>
                    <span>Ghi nhớ đăng nhập</span>
                </label>
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all text-sm">
                Đăng Nhập
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">© 2026 Vintage Always True - Hệ thống Golang hiệu năng cao</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-alert');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Đang xác thực...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || '/salev2';
                    window.location.href = redirect;
                } else {
                    alertBox.innerText = data.error || 'Email hoặc mật khẩu không chính xác';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.innerText = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
                alertBox.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
